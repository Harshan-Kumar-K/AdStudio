spring:
  application:
    name: apigateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: iam
              uri: lb://iam
              predicates:
                - Path=/api/auth/**,/api/audit-logs/**
            - id: advertiser
              uri: lb://advertiser
              predicates:
                - Path=/api/target-audiences/**,/api/campaign-briefs/**,/api/brands/**,/api/advertisers/**
            - id: creative
              uri: lb://creative
              predicates:
                - Path=/api/creative-assets/**,/api/creative-approvals/**,/api/asset-links/**
            - id: delivery
              uri: lb://delivery
              predicates:
                - Path=/api/delivery-records/**,/api/pacing-alerts/**
            - id: finance
              uri: lb://finance
              predicates:
                - Path=/api/invoices/**,/api/client-invoices/**,/api/publisher-invoices/**
            - id: mediaplan
              uri: lb://mediaplan
              predicates:
                - Path=/api/media-plans/**,/api/line-items/**,/api/insertion-orders/**,/api/delivery-records/**,/api/pacing-alerts/**
            - id: notification
              uri: lb://notification
              predicates:
                - Path=/api/notifications/**
            - id: iam-docs
              uri: lb://iam
              predicates:
                - Path=/iam/v3/api-docs
              filters:
                - RewritePath=/iam/v3/api-docs, /v3/api-docs
            - id: advertiser-docs
              uri: lb://advertiser
              predicates:
                - Path=/advertiser/v3/api-docs
              filters:
                - RewritePath=/advertiser/v3/api-docs, /v3/api-docs
            - id: creative-docs
              uri: lb://creative
              predicates:
                - Path=/creative/v3/api-docs
              filters:
                - RewritePath=/creative/v3/api-docs, /v3/api-docs
            - id: delivery-docs
              uri: lb://delivery
              predicates:
                - Path=/delivery/v3/api-docs
              filters:
                - RewritePath=/delivery/v3/api-docs, /v3/api-docs
            - id: finance-docs
              uri: lb://finance
              predicates:
                - Path=/finance/v3/api-docs
              filters:
                - RewritePath=/finance/v3/api-docs, /v3/api-docs
            - id: mediaplan-docs
              uri: lb://mediaplan
              predicates:
                - Path=/mediaplan/v3/api-docs
              filters:
                - RewritePath=/mediaplan/v3/api-docs, /v3/api-docs
            - id: notification-docs
              uri: lb://notification
              predicates:
                - Path=/notification/v3/api-docs
              filters:
                - RewritePath=/notification/v3/api-docs, /v3/api-docs

server:
  port: 9090

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

springdoc:
  swagger-ui:
    urls:
      - name: IAM
        url: /iam/v3/api-docs
      - name: Advertiser
        url: /advertiser/v3/api-docs
      - name: Creative
        url: /creative/v3/api-docs
      - name: Delivery
        url: /delivery/v3/api-docs
      - name: Finance
        url: /finance/v3/api-docs
      - name: MediaPlan
        url: /mediaplan/v3/api-docs
      - name: Notification
        url: /notification/v3/api-docs